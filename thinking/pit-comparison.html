<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旧坑 vs 新坑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .card {
    width: 720px;
    padding: 56px 48px;
    background: #161616;
    border-radius: 16px;
  }
  .title {
    font-size: 13px;
    letter-spacing: 0.15em;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 0 32px;
  }
  .divider {
    background: #2a2a2a;
    margin: 28px 0;
  }
  .col-header {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid #2a2a2a;
  }
  .old .col-header { color: #a0a0a0; }
  .new .col-header { color: #e8e8e8; }
  .row {
    margin-bottom: 20px;
  }
  .row-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .row-value {
    font-size: 15px;
    line-height: 1.5;
    color: #888;
  }
  .new .row-value {
    color: #c8c8c8;
  }
  .highlight {
    margin-top: 36px;
    padding: 20px 24px;
    background: #1e1e1e;
    border-left: 2px solid #404040;
    border-radius: 4px;
    grid-column: 1 / -1;
  }
  .highlight-text {
    font-size: 14px;
    color: #666;
    line-height: 1.7;
  }
  .highlight-text strong {
    color: #aaa;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card">
  <div class="title">AI 时代的两类坑</div>
  <div class="grid">
    <div class="col old">
      <div class="col-header">旧坑</div>
      <div class="row">
        <div class="row-label">特征</div>
        <div class="row-value">有先验，有人能拦住你</div>
      </div>
      <div class="row">
        <div class="row-label">处理方式</div>
        <div class="row-value">直接用经验，快速过</div>
      </div>
      <div class="row">
        <div class="row-label">核心能力</div>
        <div class="row-value">密度——经验越厚识别越快</div>
      </div>
      <div class="row">
        <div class="row-label">价值</div>
        <div class="row-value">降本，节约时间和 token</div>
      </div>
      <div class="row">
        <div class="row-label">AI 的影响</div>
        <div class="row-value">旧坑知识正在被民主化，稀缺性收窄</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="col new">
      <div class="col-header">新坑</div>
      <div class="row">
        <div class="row-label">特征</div>
        <div class="row-value">没有地图，不知道深浅</div>
      </div>
      <div class="row">
        <div class="row-label">处理方式</div>
        <div class="row-value">设计实验，建路径验证</div>
      </div>
      <div class="row">
        <div class="row-label">核心能力</div>
        <div class="row-value">结构——知道自己不知道什么</div>
      </div>
      <div class="row">
        <div class="row-label">价值</div>
        <div class="row-value">增量，做出真正新的东西</div>
      </div>
      <div class="row">
        <div class="row-label">AI 的影响</div>
        <div class="row-value">新坑生成速度加快，元认知需求更高</div>
      </div>
    </div>
    <div class="highlight">
      <div class="highlight-text">
        真正的认知缺口不是踩过多少坑，而是：<strong>在有限业务理解下，能不能判断出——这里该用经验，还是这里该设计实验？</strong>
      </div>
    </div>
  </div>
</div>
</body>
</html>

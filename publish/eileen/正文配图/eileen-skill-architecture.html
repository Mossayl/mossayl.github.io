<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eileen Skill Architecture</title>
<style>
  body { margin: 0; background: #f8f8f5; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; color: #111; }
  .wrap { width: 1600px; height: 1000px; padding: 56px; box-sizing: border-box; background: #f8f8f5; }
  h1 { margin: 0 0 8px; font-size: 44px; font-weight: 750; letter-spacing: 0; }
  .sub { margin: 0 0 34px; font-size: 24px; color: #62615b; }
  svg { width: 1488px; height: 820px; display: block; background: #f8f8f5; }
  .node-title { font-size: 25px; font-weight: 750; fill: #111; }
  .node-sub { font-size: 18px; fill: #62615b; }
  .tag { font-size: 14px; fill: #0f7c61; font-weight: 750; letter-spacing: .08em; }
  .small { font-size: 17px; fill: #62615b; }
  .callout { font-size: 22px; fill: #111; font-weight: 650; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Eileen：主动需求澄清 Agent 架构</h1>
  <p class="sub">把一句模糊的“我想要……”通过 2-6 轮追问，变成可执行计划。</p>

  <svg viewBox="0 0 1488 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(17,17,17,0.10)"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#62615b"/>
      </marker>
      <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#0f7c61"/>
      </marker>
    </defs>

    <rect width="1488" height="820" fill="#f8f8f5"/>
    <rect width="1488" height="820" fill="url(#dots)" opacity="0.5"/>

    <rect x="22" y="22" width="1444" height="776" fill="none" stroke="rgba(17,17,17,0.14)" stroke-width="2"/>

    <!-- Arrows -->
    <path d="M246 210 L388 210" stroke="#62615b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M656 210 L798 210" stroke="#0f7c61" stroke-width="4" fill="none" marker-end="url(#arrow-accent)"/>
    <path d="M1066 210 L1208 210" stroke="#62615b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M522 352 C522 456, 748 456, 748 352" stroke="#62615b" stroke-width="2.5" fill="none" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
    <path d="M934 352 C934 456, 708 456, 708 352" stroke="#62615b" stroke-width="2.5" fill="none" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
    <path d="M934 352 C934 570, 520 570, 520 352" stroke="#0f7c61" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow-accent)"/>

    <!-- User -->
    <rect x="74" y="112" width="172" height="196" rx="8" fill="#f8f8f5" stroke="#74726b" stroke-width="2"/>
    <text x="160" y="164" text-anchor="middle" class="tag">INPUT</text>
    <text x="160" y="214" text-anchor="middle" class="node-title">用户</text>
    <text x="160" y="248" text-anchor="middle" class="node-sub">模糊意图</text>

    <!-- A -->
    <rect x="388" y="86" width="268" height="248" rx="8" fill="rgba(15,124,97,0.08)" stroke="#0f7c61" stroke-width="3"/>
    <text x="522" y="132" text-anchor="middle" class="tag">AGENT A</text>
    <text x="522" y="186" text-anchor="middle" class="node-title">对话引导</text>
    <text x="522" y="224" text-anchor="middle" class="node-sub">自适应语气</text>
    <text x="522" y="258" text-anchor="middle" class="node-sub">提出下一轮问题</text>
    <text x="522" y="292" text-anchor="middle" class="node-sub">保持低门槛输入</text>

    <!-- B -->
    <rect x="798" y="86" width="268" height="248" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="932" y="132" text-anchor="middle" class="tag">AGENT B</text>
    <text x="932" y="186" text-anchor="middle" class="node-title">评分与建模</text>
    <text x="932" y="224" text-anchor="middle" class="node-sub">需求清晰度</text>
    <text x="932" y="258" text-anchor="middle" class="node-sub">用户状态判断</text>
    <text x="932" y="292" text-anchor="middle" class="node-sub">是否继续追问</text>

    <!-- C -->
    <rect x="1208" y="86" width="224" height="248" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="1320" y="132" text-anchor="middle" class="tag">AGENT C</text>
    <text x="1320" y="186" text-anchor="middle" class="node-title">架构输出</text>
    <text x="1320" y="224" text-anchor="middle" class="node-sub">目标拆解</text>
    <text x="1320" y="258" text-anchor="middle" class="node-sub">执行计划</text>
    <text x="1320" y="292" text-anchor="middle" class="node-sub">可交付物</text>

    <!-- Knowledge blocks -->
    <rect x="146" y="548" width="304" height="132" rx="8" fill="rgba(17,17,17,0.04)" stroke="rgba(17,17,17,0.28)" stroke-width="2"/>
    <text x="298" y="600" text-anchor="middle" class="node-title">用户模型</text>
    <text x="298" y="636" text-anchor="middle" class="node-sub">偏好、经验、表达习惯</text>

    <rect x="592" y="548" width="304" height="132" rx="8" fill="rgba(15,124,97,0.08)" stroke="#0f7c61" stroke-width="2"/>
    <text x="744" y="600" text-anchor="middle" class="node-title">澄清循环</text>
    <text x="744" y="636" text-anchor="middle" class="node-sub">2-6 轮，到足够可执行</text>

    <rect x="1038" y="548" width="304" height="132" rx="8" fill="rgba(17,17,17,0.04)" stroke="rgba(17,17,17,0.28)" stroke-width="2"/>
    <text x="1190" y="600" text-anchor="middle" class="node-title">执行方案</text>
    <text x="1190" y="636" text-anchor="middle" class="node-sub">任务、约束、验收标准</text>

    <path d="M450 614 L592 614" stroke="#62615b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M896 614 L1038 614" stroke="#62615b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="118" y="728" width="1252" height="46" rx="4" fill="#f8f8f5" stroke="rgba(17,17,17,0.16)" stroke-width="1.5"/>
    <text x="744" y="758" text-anchor="middle" class="callout">核心不是“回答问题”，而是把用户还没说清楚的需求问清楚。</text>
  </svg>
</div>
</body>
</html>

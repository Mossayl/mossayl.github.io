<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; width: 1600px; height: 1000px; background: #f8f8f5; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; color: #111; }
  .wrap { position: relative; width: 1600px; height: 1000px; padding: 72px; box-sizing: border-box; background:
    linear-gradient(90deg, rgba(17,17,17,.06) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(0deg, rgba(17,17,17,.05) 1px, transparent 1px) 0 0 / 48px 48px,
    #f8f8f5; }
  .frame { position:absolute; inset: 44px; border: 2px solid rgba(17,17,17,.16); }
  .kicker { color:#0f7c61; font-size: 28px; font-weight: 800; letter-spacing: .08em; }
  h1 { margin: 92px 0 24px; font-size: 78px; line-height: 1.06; letter-spacing: 0; max-width: 980px; }
  .sub { font-size: 32px; line-height: 1.45; color:#62615b; max-width: 980px; font-weight: 600; }
  .logos { position: absolute; left: 72px; right: 72px; bottom: 110px; display: grid; grid-template-columns: 1fr 160px 1fr; gap: 32px; align-items: center; }
  .box { height: 240px; border: 3px solid #0f7c61; background: rgba(15,124,97,.06); display:flex; align-items:center; justify-content:center; padding: 42px; box-sizing: border-box; }
  .box img { max-width: 100%; max-height: 150px; object-fit: contain; }
  .plus { height: 160px; width: 160px; border-radius: 50%; background: #0f7c61; color:#f8f8f5; display:flex; align-items:center; justify-content:center; font-size: 82px; font-weight: 800; }
  .caption { position:absolute; left:72px; right:72px; bottom:52px; display:flex; justify-content:space-between; color:#62615b; font-size:22px; font-weight:650; }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame"></div>
  <div class="kicker">SOURCE / CLAUDE CODE</div>
  <h1>Claude Code 这类产品，核心不是 idea，是做它的人</h1>
  <div class="sub">参考 The Pragmatic Engineer 对 Claude Code 团队的深访，以及 Claude Code 官方产品定位。</div>
  <div class="logos">
    <div class="box"><img src="./pragmatic-engineer-logo-wide.png" alt="The Pragmatic Engineer logo"></div>
    <div class="plus">+</div>
    <div class="box"><img src="./claude-ai-logo.svg" alt="Claude logo"></div>
  </div>
  <div class="caption"><span>How Claude Code is built</span><span>Claude Code / Anthropic</span></div>
</div>
</body>
</html>

baseURL: https://mossayl.github.io/
title: 叶玲（Mossayl）· AI 产品与 Agent
theme: PaperMod

defaultContentLanguage: zh
hasCJKLanguage: true

pagination:
  pagerSize: 10

languages:
  zh:
    locale: zh-CN
    label: 中文
    weight: 1

params:
  env: production
  author: 叶玲（Mossayl）
  description: "AI 产品、Agent 系统、模型评测与个人研究"
  label:
    text: Mossayl
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  defaultTheme: auto
  disableThemeToggle: false

  homeInfoParams:
    Title: "Hi，我是叶玲（Mossayl）"
    Content: "AI 产品经理，也是 Agent workflow builder。这里集中展示我的工作经历、个人 Agent 项目和长期写作。"

  socialIcons:
    - name: github
      url: "https://github.com/Mossayl"
    - name: twitter
      url: "https://twitter.com/mossayl"

menu:
  main:
    - identifier: experience
      name: 经历
      url: /experience/
      weight: 5
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 15
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
